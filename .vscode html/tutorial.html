<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Member Roster App</title>

    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
    <div class="container">
        <h2 id="app-title">Member Roster</h2>
        <p id="app-status"></p>
        
        <input type="text" id="nameInput" placeholder="Enter Member Name">
        <input type="text" id="roleInput" placeholder="Enter Role (e.g., Admin, User)">
        <button id="addBtn">Add Member</button>
        
        <ul id="memberList"></ul>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
