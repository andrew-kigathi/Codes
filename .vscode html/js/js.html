            <script>
                document.write("<h4>WHILE LOOP:</h4>");
                //WHILE LOOP
                let i = 7;
                while(i <= 13){ //This will print numbers from 7 to 13
                    document.write(i + "<br>"); //This will print the value of i followed by a line break
                    i+=2; //This will increment the value of i by 2 in each iteration
                }

                document.write("<h4>DO WHILE LOOP:</h4>");
                //DO WHILE LOOP
                let j = 10;
                do{
                    document.write(j + "<br>"); //This will print the value of j followed by a line break
                    j+=3; //This will increment the value of j by 3 in each iteration
                } while(j <= 25); //This will continue the loop as long as j is less than or equal to 25

                document.write("<h4>FOR LOOP:</h4>");
                //FOR LOOP
                for(let k = 1; k <= 5; k++){
                    document.write(k + "<br>"); //This will print the value of k followed by a line break
                }

                document.write("<h4>FOR-OF LOOP:</h4>");
                //FOR-OF LOOP
                let colors = ["Red", "Green", "Blue"];
                for(let color of colors){
                    document.write(color + "<br>"); //This will print each color in the colors array followed by a line break
                }

                document.write("<h4>FOR-IN LOOP:</h4>");
                //FOR-IN LOOP
                let person = {
                    name: "Alice",
                    age: 30,
                    city: "New York"
                };
                for(let key in person){
                    document.write(key + ": " + person[key] + "<br>"); //This will print each key and its corresponding value in the person object followed by a line break
                }
            </script>
